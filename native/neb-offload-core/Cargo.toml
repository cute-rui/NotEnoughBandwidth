[package]
name = "neb-offload-core"
description = "Wire protocol and streaming zstd contexts for the NEB remote zstd offload service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# High-level safe zstd bindings. Must be able to express the mod's exact
# zstd-jni semantics: magicless frames, explicit windowLog, per-connection
# streaming contexts flushed after every message.
zstd = { version = "0.13", features = ["experimental"] }
